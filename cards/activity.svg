<svg xmlns="http://www.w3.org/2000/svg" width="880" height="224" viewBox="0 0 880 224" role="img" aria-label="Actividad mensual: 99 días activos, racha máxima de 19 días"><title>Actividad mensual: 99 días activos, racha máxima de 19 días</title><style>
