<svg xmlns="http://www.w3.org/2000/svg" width="440" height="212" viewBox="0 0 440 212" role="img" aria-label="CIENCIA DE DATOS: Datos ciencia y análisis. Análisis, visualización y aprendizaje automático con Python, Pandas y notebooks."><title>CIENCIA DE DATOS: Datos ciencia y análisis. Análisis, visualización y aprendizaje automático con Python, Pandas y notebooks.</title><style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,'JetBrains Mono',SFMono-Regular,Consolas,Menlo,monospace}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .6s ease both}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.nudge{animation:nudge 1.8s ease-in-out infinite}
.grow{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom}
.sheen{animation:sheen 6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{50%{opacity:.25}}
@keyframes nudge{50%{transform:translateX(5px)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes sheen{0%,55%{transform:translateX(-500px)}100%{transform:translateX(1100px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sheen{display:none}}
