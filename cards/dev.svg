<svg xmlns="http://www.w3.org/2000/svg" width="440" height="212" viewBox="0 0 440 212" role="img" aria-label="SOFTWARE: Desarrollo backend y web. APIs con FastAPI y Laravel, sitios con Astro y entornos con Docker."><title>SOFTWARE: Desarrollo backend y web. APIs con FastAPI y Laravel, sitios con Astro y entornos con Docker.</title><style>
