0">Stack</text></g><rect x="150" y="28" width="30" height="8" rx="2" fill="#71717a"/><rect x="155" y="28" width="3" height="8" fill="#27272a"/><rect x="161" y="28" width="3" height="8" fill="#27272a"/><rect x="177" y="26" width="4" height="12" rx="1" fill="#d4d4d8"/><circle cx="170" cy="32" r="1.8" fill="#ef4444"/><g class="ignite" style="animation-delay:0.60s"><g class="hum"><rect x="182" y="25" width="650" height="14" rx="7" fill="#ef4444" opacity=".16"/><rect x="182" y="27.5" width="650" height="9" rx="4.5" fill="#ef4444" opacity=".4"/></g><rect x="182" y="29.5" width="650" height="5" rx="2.5" fill="#ef4444"/><rect x="182" y="31" width="647" height="2" rx="1" fill="#fff"/></g></g><rect x="4.5" y="4.5" width="871" height="55" rx="13.5" fill="none" stroke="#2a2526"/></svg>